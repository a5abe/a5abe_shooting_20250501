<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rust WebAssembly Shooting Game</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #111;
            font-family: Arial, sans-serif;
            color: white;
        }

        .game-container {
            position: relative;
            width: 600px;
            height: 600px;
        }

        #game-canvas {
            width: 100%;
            height: 100%;
            background-color: #000022;
            border: 2px solid #4488ff;
            border-radius: 5px;
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            text-align: center;
        }

        .controls {
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <div class="game-container">
        <canvas id="game-canvas" width="600" height="600"></canvas>
        <div id="loading" class="loading">Loading game...</div>
        <div class="controls">
            <p>Controls: Arrow keys or WASD to move, SPACE to shoot, ESC to pause</p>
        </div>
    </div>

    <script type="module">
        // Import our WebAssembly module
        import init from './pkg/a5abe_shooting_20250501.js';

        // Initialize the WebAssembly module
        async function start() {
            try {
                // Load and instantiate the WebAssembly module
                await init();

                // Hide the loading text
                document.getElementById('loading').style.display = 'none';

            } catch (error) {
                console.error('Failed to initialize the game:', error);
                document.getElementById('loading').textContent = 'Failed to load the game. Please try again.';
            }
        }

        // Start the game
        start();
    </script>
</body>

</html>
